<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal admin</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; background: #f4f6f8; margin: 0; color: #222; }
  .wrap { max-width: 380px; margin: 80px auto; padding: 0 16px; }
  .box { background: #fff; border: 1px solid #e0e0e0; border-radius: 12px; padding: 24px; }
  h1 { font-size: 1.2rem; color: #2c3e50; margin-top: 0; }
  input { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; }
  button { margin-top: 12px; width: 100%; padding: 11px; border: none; border-radius: 8px; background: #2980b9; color: #fff; font-size: 15px; cursor: pointer; }
  .err { color: #c0392b; font-size: 13px; }
</style>
</head>
<body>
<div class="wrap"><div class="box">
  <h1>Portal admin</h1>
  {% if wrong %}<p class="err">That password didn't match.</p>{% endif %}
  <form method="get">
    <input type="password" name="key" placeholder="Admin password" autofocus>
    <button type="submit">Open</button>
  </form>
</div></div>
</body>
</html>
