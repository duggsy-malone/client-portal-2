<!DOCTYPE html>
<html lang="en">
<head>
{% include '_head.html' %}
<meta name="robots" content="noindex">
<title>{{ app_name }} admin</title>
</head>
<body class="fp-onpaper">
<div class="fp-shell" style="max-width:420px">
  <header class="fp-header">{% include '_lockup.html' %}</header>
  <div class="fp-card">
    <span class="fp-label">Studio</span>
    <h2>Sign in</h2>
    {% if wrong %}<p class="fp-note" style="color:var(--fp-ember);background:#FDEDE6;border-color:#F3C7B2">That password didn't match.</p>{% endif %}
    <form method="get">
      <input class="fp-input" type="password" name="key" placeholder="Admin password" autofocus>
      <button type="submit" class="fp-btn fp-btn--block" style="margin-top:12px">Open</button>
    </form>
  </div>
  <p class="fp-small fp-foot__legal" style="margin-top:14px">{{ app_name }} V{{ version }}</p>
</div>
</body>
</html>
