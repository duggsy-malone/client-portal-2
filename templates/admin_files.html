<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Files for quote {{ reference_number }}</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; background: #f4f6f8; margin: 0; color: #222; }
  .wrap { max-width: 760px; margin: 32px auto; padding: 0 16px; }
  h1 { font-size: 1.3rem; color: #2c3e50; }
  .box { background: #fff; border: 1px solid #e0e0e0; border-radius: 12px; padding: 8px 18px; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid #eee; font-size: 14px; }
  .row:last-child { border-bottom: none; }
  .row a { color: #2980b9; word-break: break-all; }
  .size { color: #777; white-space: nowrap; }
  .note { color: #666; font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <p><a href="{{ url_for('attention', key=key) }}">&larr; Back</a></p>
  <h1>Files for quote ref {{ reference_number }}</h1>
  <p class="note">{{ files|length }} file(s). Links work for 1 hour - reload this page for fresh ones.</p>
  <div class="box">
    {% for f in files %}
    <div class="row"><a href="{{ f.url }}">{{ f.name }}</a><span class="size">{{ f.mb }} MB</span></div>
    {% else %}
    <div class="row">No files found.</div>
    {% endfor %}
  </div>
</div>
</body>
</html>
